<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <style>
      .sheet { fill: #f8fafc; }
      .frame { fill: none; stroke: #111827; stroke-width: 2; }
      .axis { stroke: #111827; stroke-width: 2; marker-end: url(#arrow); }
      .dim { stroke: #1f2937; stroke-width: 2; marker-start: url(#arrow); marker-end: url(#arrow); }
      .range { fill: none; stroke: #0ea5e9; stroke-width: 3; stroke-dasharray: 12 8; }
      .range2 { fill: none; stroke: #22c55e; stroke-width: 3; stroke-dasharray: 12 8; }
      .line1 { stroke: #0ea5e9; stroke-width: 4; fill: none; }
      .line2 { stroke: #22c55e; stroke-width: 4; fill: none; }
      .guide { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 8 6; }
      .anchor { fill: #dcfce7; stroke: #166534; stroke-width: 3; }
      .tag { fill: #fee2e2; stroke: #991b1b; stroke-width: 3; }
      .text { font-family: Arial, Helvetica, sans-serif; fill: #111827; font-size: 22px; }
      .small { font-family: Arial, Helvetica, sans-serif; fill: #111827; font-size: 16px; }
      .tiny { font-family: Arial, Helvetica, sans-serif; fill: #111827; font-size: 13px; }
      .title { font-family: Arial, Helvetica, sans-serif; fill: #111827; font-size: 30px; font-weight: 700; }
      .formula { font-family: Consolas, monospace; fill: #111827; font-size: 19px; }
    </style>
  </defs>

  <rect class="sheet" x="0" y="0" width="1200" height="800"/>
  <rect class="frame" x="35" y="35" width="1130" height="730"/>

  <text class="title" x="60" y="80">Axiom MK0 - Geometria follow-me UWB a due anchor</text>
  <text class="small" x="60" y="112">Origine al centro del muso rover. Tag operatore nel semipiano frontale.</text>

  <!-- Axes -->
  <line class="axis" x1="600" y1="635" x2="600" y2="160"/>
  <line class="axis" x1="260" y1="600" x2="940" y2="600"/>
  <text class="small" x="615" y="170">y avanti</text>
  <text class="small" x="912" y="585">x destra</text>
  <text class="tiny" x="613" y="620">O</text>

  <!-- Anchors and tag -->
  <circle class="anchor" cx="420" cy="600" r="24"/>
  <circle class="anchor" cx="780" cy="600" r="24"/>
  <circle class="tag" cx="685" cy="265" r="28"/>
  <text class="small" x="334" y="642">Anchor SX (-W/2, 0)</text>
  <text class="small" x="716" y="642">Anchor DX (W/2, 0)</text>
  <text class="small" x="714" y="255">Tag operatore</text>
  <text class="tiny" x="714" y="277">(x, y)</text>

  <!-- Distances -->
  <line class="line1" x1="420" y1="600" x2="685" y2="265"/>
  <line class="line2" x1="780" y1="600" x2="685" y2="265"/>
  <text class="text" x="500" y="405" fill="#0ea5e9">d1</text>
  <text class="text" x="750" y="405" fill="#22c55e">d2</text>
  <circle class="range" cx="420" cy="600" r="350"/>
  <circle class="range2" cx="780" cy="600" r="350"/>

  <!-- Dimensions and projection -->
  <line class="dim" x1="420" y1="690" x2="780" y2="690"/>
  <line class="guide" x1="420" y1="600" x2="420" y2="690"/>
  <line class="guide" x1="780" y1="600" x2="780" y2="690"/>
  <text class="small" x="510" y="720">W = 0,60 m baseline anchor</text>

  <line class="guide" x1="685" y1="265" x2="685" y2="600"/>
  <line class="guide" x1="600" y1="265" x2="685" y2="265"/>
  <line class="dim" x1="600" y1="245" x2="685" y2="245"/>
  <text class="small" x="633" y="235">x</text>
  <line class="dim" x1="710" y1="600" x2="710" y2="265"/>
  <text class="small" x="723" y="440">y</text>

  <!-- Formula panel -->
  <rect x="75" y="160" width="360" height="160" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text class="small" x="95" y="192">Calcolo firmware</text>
  <text class="formula" x="95" y="225">x = (d1^2 - d2^2) / (2W)</text>
  <text class="formula" x="95" y="258">y = sqrt(d1^2 - (x + W/2)^2)</text>
  <text class="formula" x="95" y="291">theta = atan2(x, y)</text>

  <rect x="775" y="150" width="330" height="175" rx="8" fill="#fff7ed" stroke="#9a3412" stroke-width="2"/>
  <text class="small" x="795" y="182">Regola di sicurezza</text>
  <text class="tiny" x="795" y="214">Se il radicando e' negativo,</text>
  <text class="tiny" x="795" y="235">se d1/d2 saltano troppo,</text>
  <text class="tiny" x="795" y="256">o se il tag sparisce:</text>
  <text class="small" x="795" y="290">drive_command = STOP</text>
</svg>
