<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <style>
      .sheet { fill: #f8fafc; }
      .frame { fill: none; stroke: #111827; stroke-width: 2; }
      .block { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 8; }
      .mcu { fill: #e0f2fe; stroke: #075985; stroke-width: 3; }
      .sensor { fill: #dcfce7; stroke: #166534; stroke-width: 2; }
      .power { fill: #fee2e2; stroke: #991b1b; stroke-width: 2; }
      .act { fill: #ede9fe; stroke: #5b21b6; stroke-width: 2; }
      .safety { fill: #fff7ed; stroke: #9a3412; stroke-width: 2; }
      .wire { stroke: #1f2937; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .can { stroke: #7c3aed; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .stop { stroke: #dc2626; stroke-width: 3.5; fill: none; marker-end: url(#arrow); }
      .text { font-family: Arial, Helvetica, sans-serif; fill: #111827; font-size: 22px; }
      .small { font-family: Arial, Helvetica, sans-serif; fill: #111827; font-size: 16px; }
      .tiny { font-family: Arial, Helvetica, sans-serif; fill: #111827; font-size: 13px; }
      .title { font-family: Arial, Helvetica, sans-serif; fill: #111827; font-size: 30px; font-weight: 700; }
    </style>
  </defs>

  <rect class="sheet" x="0" y="0" width="1200" height="800"/>
  <rect class="frame" x="35" y="35" width="1130" height="730"/>

  <text class="title" x="60" y="80">Axiom MK0 - Architettura controllo e cablaggio logico</text>
  <text class="small" x="60" y="112">Schema funzionale: separare potenza, logica, safety e diagnostica.</text>

  <!-- Operator -->
  <rect class="sensor" x="65" y="180" width="210" height="96" rx="8"/>
  <text class="small" x="100" y="215">Operatore</text>
  <text class="tiny" x="92" y="242">Tag UWB</text>
  <text class="tiny" x="92" y="263">Pausa / Stop radio</text>

  <!-- Sensors -->
  <rect class="sensor" x="65" y="340" width="210" height="190" rx="8"/>
  <text class="small" x="108" y="372">Sensori locali</text>
  <text class="tiny" x="92" y="405">2x Anchor UWB</text>
  <text class="tiny" x="92" y="430">4x ToF frontali</text>
  <text class="tiny" x="92" y="455">IMU assetto</text>
  <text class="tiny" x="92" y="480">GNSS ausiliario</text>
  <text class="tiny" x="92" y="505">Temperatura / tensione</text>

  <!-- MCU -->
  <rect class="mcu" x="415" y="235" width="300" height="250" rx="10"/>
  <text class="text" x="510" y="275">ESP32-S3</text>
  <text class="tiny" x="450" y="315">state machine: INIT / IDLE / FOLLOW</text>
  <text class="tiny" x="450" y="340">DEGRADED / STOP / ESTOP</text>
  <text class="tiny" x="450" y="375">target_distance, target_angle</text>
  <text class="tiny" x="450" y="400">safety_state, fault_code</text>
  <text class="tiny" x="450" y="425">drive_command limitato</text>
  <text class="tiny" x="450" y="450">watchdog + logging</text>

  <!-- Actuation -->
  <rect class="act" x="850" y="210" width="255" height="150" rx="8"/>
  <text class="small" x="930" y="244">VESC / CAN</text>
  <text class="tiny" x="885" y="276">motori SX / DX</text>
  <text class="tiny" x="885" y="301">corrente, fault, temp</text>
  <text class="tiny" x="885" y="326">limite corrente firmware</text>

  <rect class="power" x="850" y="430" width="255" height="105" rx="8"/>
  <text class="small" x="923" y="464">Potenza 24 V</text>
  <text class="tiny" x="883" y="493">BMS, fusibili, sezionatore</text>
  <text class="tiny" x="883" y="516">DC-DC logica separato</text>

  <rect class="safety" x="850" y="590" width="255" height="95" rx="8"/>
  <text class="small" x="920" y="623">Safety fisica</text>
  <text class="tiny" x="883" y="651">E-stop, freni meccanici</text>
  <text class="tiny" x="883" y="672">fail-safe su perdita comando</text>

  <!-- Logging -->
  <rect class="block" x="425" y="590" width="270" height="95" rx="8"/>
  <text class="small" x="505" y="623">Micro-SD</text>
  <text class="tiny" x="455" y="651">log CSV / JSONL per ogni run</text>
  <text class="tiny" x="455" y="672">eventi, fault, UWB, comandi</text>

  <!-- Connections -->
  <path class="wire" d="M275 228 C335 230 365 255 415 285"/>
  <path class="wire" d="M275 430 C340 430 365 405 415 385"/>
  <path class="can" d="M715 310 C775 290 805 285 850 285"/>
  <path class="wire" d="M715 455 C760 480 805 486 850 486"/>
  <path class="stop" d="M850 638 C780 625 745 570 675 485"/>
  <path class="wire" d="M560 485 L560 590"/>

  <text class="tiny" x="310" y="218">radio / ranging</text>
  <text class="tiny" x="305" y="420">I2C / SPI / UART</text>
  <text class="tiny" x="755" y="275">CAN bus</text>
  <text class="tiny" x="760" y="465">alimentazione</text>
  <text class="tiny" x="715" y="610">stop prioritario</text>
</svg>
