<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <style>
      .sheet { fill: #f8fafc; }
      .frame { fill: none; stroke: #111827; stroke-width: 2; }
      .part { fill: #e5e7eb; stroke: #111827; stroke-width: 3; }
      .steel { fill: #cbd5e1; stroke: #111827; stroke-width: 3; }
      .bearing { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 3; }
      .motor { fill: #ede9fe; stroke: #5b21b6; stroke-width: 3; }
      .wheel { fill: #374151; stroke: #020617; stroke-width: 4; }
      .brake { fill: #fee2e2; stroke: #991b1b; stroke-width: 3; }
      .shaft { fill: #fef3c7; stroke: #92400e; stroke-width: 3; }
      .axis { stroke: #64748b; stroke-width: 2; stroke-dasharray: 10 6; }
      .call { stroke: #1f2937; stroke-width: 2; marker-end: url(#arrow); }
      .small { font-family: Arial, Helvetica, sans-serif; fill: #111827; font-size: 16px; }
      .tiny { font-family: Arial, Helvetica, sans-serif; fill: #111827; font-size: 13px; }
      .title { font-family: Arial, Helvetica, sans-serif; fill: #111827; font-size: 30px; font-weight: 700; }
    </style>
  </defs>

  <rect class="sheet" x="0" y="0" width="1400" height="850"/>
  <rect class="frame" x="35" y="35" width="1330" height="780"/>
  <text class="title" x="65" y="82">Axiom MK0 - Vista esplosa concettuale del ponte corazzato</text>
  <text class="small" x="65" y="114">Scopo: mostrare il percorso dei carichi. Il riduttore trasmette coppia, il cuscinetto esterno prende carico radiale/flettente.</text>

  <line class="axis" x1="130" y1="420" x2="1280" y2="420"/>

  <!-- Motor -->
  <rect class="motor" x="120" y="330" width="150" height="180" rx="18"/>
  <circle class="motor" cx="270" cy="420" r="42"/>
  <text class="small" x="130" y="305">Motore ridotto</text>
  <text class="tiny" x="130" y="530">24 V, 200 W, 71.5:1</text>

  <!-- Inner plate -->
  <rect class="steel" x="360" y="260" width="58" height="320" rx="4"/>
  <text class="small" x="330" y="238">Piastra acciaio 6 mm</text>
  <text class="tiny" x="326" y="604">saldata/imbullonata al telaio</text>

  <!-- Shaft -->
  <rect class="shaft" x="475" y="394" width="385" height="52" rx="24"/>
  <rect class="shaft" x="482" y="372" width="86" height="96" rx="10"/>
  <circle class="shaft" cx="880" cy="420" r="56"/>
  <text class="small" x="560" y="365">Albero custom 42CrMo4</text>
  <text class="tiny" x="520" y="470">foro 14 mm + cava chiavetta</text>
  <text class="tiny" x="675" y="470">sezione 20 mm h6</text>
  <text class="tiny" x="846" y="493">flangia ruota</text>

  <!-- Bearing -->
  <rect class="bearing" x="775" y="305" width="150" height="230" rx="20"/>
  <circle fill="#f8fafc" stroke="#1d4ed8" stroke-width="8" cx="850" cy="420" r="62"/>
  <text class="small" x="785" y="282">UCF204 esterno</text>
  <text class="tiny" x="770" y="558">scarica carichi sul telaio</text>

  <!-- Brake disc and wheel -->
  <circle class="brake" cx="1030" cy="420" r="82"/>
  <circle fill="#f8fafc" stroke="#991b1b" stroke-width="3" cx="1030" cy="420" r="38"/>
  <text class="small" x="980" y="305">Disco 203 mm</text>
  <text class="tiny" x="984" y="534">freno meccanico</text>

  <circle class="wheel" cx="1210" cy="420" r="125"/>
  <circle fill="#cbd5e1" stroke="#111827" stroke-width="3" cx="1210" cy="420" r="48"/>
  <text class="small" x="1150" y="270">Ruota cargo 20"</text>
  <text class="tiny" x="1145" y="572">mozzo 6 fori IS</text>

  <!-- Arrows between components -->
  <line class="call" x1="285" y1="420" x2="350" y2="420"/>
  <line class="call" x1="420" y1="420" x2="470" y2="420"/>
  <line class="call" x1="920" y1="420" x2="945" y2="420"/>
  <line class="call" x1="1115" y1="420" x2="1080" y2="420"/>

  <!-- Load path -->
  <path d="M1210 625 C1090 690 880 690 805 545" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow)"/>
  <text class="small" x="910" y="715">percorso carichi radiali: ruota -> albero -> UCF204 -> telaio</text>

  <path d="M160 650 C300 700 495 690 620 452" fill="none" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow)"/>
  <text class="small" x="130" y="715">percorso coppia: motore -> albero -> flangia -> ruota</text>

  <rect x="70" y="750" width="1260" height="36" fill="#fff7ed" stroke="#9a3412" stroke-width="1.5"/>
  <text class="small" x="90" y="774">Nota: esploso concettuale. Tolleranze, chiavette, bulloneria e sedi vanno definite in tavola meccanica dedicata.</text>
</svg>
